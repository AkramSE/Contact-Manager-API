spring.application.name=contact-manager
server.port=8080

# Database Connection
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ContactManagerDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123

# Naya aur Sahi Hibernate Dialect (Spring Boot 3 ke liye)
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration